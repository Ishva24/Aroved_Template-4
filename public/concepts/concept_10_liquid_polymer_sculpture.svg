<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    
    <!-- Glow and Lighting Filters -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Linear Text Gradient for 'engineered' -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glove Gradients -->
    <linearGradient id="blueGloveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="blackGloveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Orbit Gradient -->
    <linearGradient id="orbitGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <!-- Glove Backlight -->
    <radialGradient id="glovesBacklight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>


    <!-- Background Base Gradient: Velvet Obsidian -->
    <linearGradient id="bgGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020307"/>
      <stop offset="45%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#010206"/>
    </linearGradient>

    <!-- Liquid Chrome Polymer Ribbon Gradient 1 -->
    <linearGradient id="liquidPolymer1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.2"/>
      <stop offset="20%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#0369a1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Liquid Chrome Polymer Ribbon Gradient 2 -->
    <linearGradient id="liquidPolymer2" x1="100%" y1="20%" x2="0%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Ambient Liquid Crucible Core Glow -->
    <radialGradient id="crucibleGlow" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#0369a1" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#020307" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Velvet Obsidian Backdrop -->
  <rect width="1920" height="1080" fill="url(#bgGrad10)"/>

  <!-- Liquid Crucible Core Ambient Glow -->
  <ellipse cx="1450" cy="520" rx="750" ry="500" fill="url(#crucibleGlow)"/>

  <!-- Zero-G Liquid Polymer Kinetic Ribbon Swirls -->
  <g id="liquid-ribbons">
    <!-- Outer Deep Fluid Ribbon -->
    <path d="M 980,180 C 1220,60 1680,80 1860,280 C 2000,440 1880,720 1620,860 C 1380,980 1080,920 1020,780 C 960,640 1150,480 1320,440 C 1520,390 1650,480 1620,600 C 1590,720 1440,760 1340,710"
          fill="none" stroke="url(#liquidPolymer1)" stroke-width="26" stroke-linecap="round" opacity="0.65" filter="url(#dropGlow)"/>

    <!-- Inner High-Gloss Specular Chrome Liquid Ribbon -->
    <path d="M 1120,280 C 1340,160 1720,200 1820,380 C 1900,520 1790,740 1560,840 C 1340,940 1140,860 1120,720 C 1100,580 1280,450 1440,430 C 1580,410 1660,490 1630,590"
          fill="none" stroke="url(#liquidPolymer2)" stroke-width="12" stroke-linecap="round" opacity="0.85" filter="url(#dropGlow)"/>

    <!-- Ultra-fine Core Molten Specular Centerline -->
    <path d="M 1140,290 C 1340,180 1700,210 1790,380 C 1870,510 1760,720 1550,820 C 1350,910 1160,840 1140,710 C 1120,600 1280,470 1420,450"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" filter="url(#softBlur)"/>

    <!-- Floating Liquid Nitrile Droplets in Zero-G -->
    <circle cx="1060" cy="220" r="14" fill="url(#liquidPolymer1)" filter="url(#dropGlow)"/>
    <circle cx="1057" cy="217" r="4" fill="#ffffff" opacity="0.8"/>

    <circle cx="1840" cy="480" r="18" fill="url(#liquidPolymer2)" filter="url(#dropGlow)"/>
    <circle cx="1836" cy="475" r="5" fill="#ffffff" opacity="0.9"/>

    <circle cx="1200" cy="890" r="12" fill="url(#liquidPolymer1)" filter="url(#dropGlow)"/>
    <circle cx="1198" cy="888" r="3" fill="#ffffff" opacity="0.8"/>

    <circle cx="1680" cy="740" r="10" fill="#38bdf8" opacity="0.7"/>
    <circle cx="1380" cy="380" r="8" fill="#e0f2fe" opacity="0.8"/>
  </g>

  <!-- Concept 10 Badge -->
  <g transform="translate(1360, 110)">
    <rect x="0" y="0" width="460" height="34" rx="17" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#38bdf8"/>
    <text x="32" y="22" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="2" font-family="monospace">CONCEPT 10 // LIQUID POLYMER SCULPTURE</text>
  </g>

  <!-- Technical Standards Telemetry -->
  <g transform="translate(90, 1010)" opacity="0.6">
    <text x="0" y="0" fill="#38bdf8" font-size="11" font-family="monospace">NBR SYNTHETIC COPOLYMER VISCOSITY: 1800 cP</text>
    <text x="420" y="0" fill="#64748b" font-size="11" font-family="monospace">│  PRECISION DIPPING FORMULATION</text>
    <text x="760" y="0" fill="#64748b" font-size="11" font-family="monospace">│  ZERO ACCELERATOR RESIDUE (TYPE IV ALLERGY FREE)</text>
  </g>

  
  <!-- Top Navigation Bar -->
  <g id="navbar" transform="translate(60, 45)">
    <!-- Brand Logo -->
    <g transform="translate(0, 0)">
      <polygon points="0,0 24,-12 36,8 16,24" fill="#0284c7" opacity="0.9"/>
      <polygon points="16,24 36,8 44,28 20,38" fill="#38bdf8" opacity="0.95"/>
      <polygon points="0,0 16,24 20,38 -6,20" fill="#0369a1" opacity="0.8"/>
      <text x="56" y="16" fill="#ffffff" font-size="20" font-weight="900" letter-spacing="3" font-family="'Plus Jakarta Sans', system-ui, sans-serif">AROVED</text>
      <text x="56" y="32" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif">HEALTHCARE</text>
    </g>

    <!-- Nav Links Pill -->
    <g transform="translate(420, 2)">
      <rect x="0" y="0" width="620" height="46" rx="23" fill="rgba(6, 15, 30, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="45" y="28" fill="#ffffff" font-size="14" font-weight="600" font-family="system-ui">Home</text>
      <text x="125" y="28" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui">About</text>
      <text x="205" y="28" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui">Products ▾</text>
      <text x="315" y="28" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui">Expertise</text>
      <text x="415" y="28" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui">Why Aroved</text>
      <text x="535" y="28" fill="rgba(255,255,255,0.7)" font-size="14" font-family="system-ui">Contact</text>
    </g>

    <!-- Right Contact & CTA -->
    <g transform="translate(1380, 2)">
      <text x="0" y="28" fill="rgba(255,255,255,0.85)" font-size="14" font-weight="500" font-family="system-ui">+91 6366939345</text>
      <rect x="150" y="0" width="130" height="46" rx="23" fill="#ffffff"/>
      <text x="185" y="28" fill="#040a18" font-size="14" font-weight="700" font-family="system-ui">Enquire</text>
    </g>
  </g>

  <!-- Left Content Block -->
  <g id="hero-content" transform="translate(90, 240)">
    <!-- Overline Badge -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
      <text x="22" y="10" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="3" font-family="monospace">A HEALTHCARE ENTERPRISE • AROSAFE®</text>
    </g>

    <!-- Headline -->
    <text x="0" y="90" fill="#ffffff" font-size="76" font-weight="900" font-family="'Plus Jakarta Sans', system-ui, sans-serif" letter-spacing="-1.5">Infection control,</text>
    <text x="0" y="175" fill="url(#titleGradient)" font-size="76" font-weight="900" font-family="'Plus Jakarta Sans', system-ui, sans-serif" letter-spacing="-1.5">engineered</text>
    <text x="0" y="260" fill="#ffffff" font-size="76" font-weight="900" font-family="'Plus Jakarta Sans', system-ui, sans-serif" letter-spacing="-1.5">for care.</text>

    <!-- Body Description -->
    <text x="0" y="325" fill="rgba(226, 232, 240, 0.85)" font-size="18" font-family="system-ui" line-height="1.6">
      <tspan x="0" dy="0">Aroved Healthcare Pvt Ltd delivers a complete range of infection</tspan>
      <tspan x="0" dy="28">control products under our brand </tspan>
      <tspan fill="#ffffff" font-weight="700">AROSAFE®</tspan>
      <tspan> — enhancing service</tspan>
      <tspan x="0" dy="28">quality for hospitals, customers and patients.</tspan>
    </text>

    <!-- Action Buttons -->
    <g transform="translate(0, 440)">
      <!-- Primary Pill -->
      <g>
        <rect x="0" y="0" width="260" height="58" rx="29" fill="#ffffff" filter="url(#dropGlow)"/>
        <text x="32" y="35" fill="#040a18" font-size="15" font-weight="700" font-family="system-ui">Enter the product universe</text>
        <circle cx="225" cy="29" r="14" fill="#040a18"/>
        <text x="220" y="34" fill="#ffffff" font-size="14">↗</text>
      </g>
      <!-- Secondary Pill -->
      <g transform="translate(280, 0)">
        <rect x="0" y="0" width="180" height="58" rx="29" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
        <text x="35" y="35" fill="#ffffff" font-size="15" font-weight="600" font-family="system-ui">Request a quote</text>
      </g>
    </g>

    <!-- Metrics Row -->
    <g transform="translate(0, 560)">
      <g>
        <text x="0" y="36" fill="#ffffff" font-size="44" font-weight="800" font-family="'Plus Jakarta Sans', system-ui">20+</text>
        <text x="0" y="58" fill="rgba(255,255,255,0.6)" font-size="12" font-weight="600" letter-spacing="2" font-family="monospace">GLOBAL METRICS</text>
      </g>
      <g transform="translate(190, 0)">
        <text x="0" y="36" fill="#ffffff" font-size="44" font-weight="800" font-family="'Plus Jakarta Sans', system-ui">250+</text>
        <text x="0" y="58" fill="rgba(255,255,255,0.6)" font-size="12" font-weight="600" letter-spacing="2" font-family="monospace">HOSPITALS</text>
      </g>
      <g transform="translate(390, 0)">
        <text x="0" y="36" fill="#ffffff" font-size="44" font-weight="800" font-family="'Plus Jakarta Sans', system-ui">500+</text>
        <text x="0" y="58" fill="rgba(255,255,255,0.6)" font-size="12" font-weight="600" letter-spacing="2" font-family="monospace">DISTRIBUTORS</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Stage: Central Glove Duo & Orbiting Satellites -->
  <g id="hero-gloves" transform="translate(1180, 220)">
    <!-- Dynamic Glow Aura behind Gloves -->
    <ellipse cx="260" cy="360" rx="360" ry="420" fill="url(#glovesBacklight)" opacity="0.6"/>

    <!-- Orbital Trajectory Ring -->
    <ellipse cx="260" cy="380" rx="430" ry="220" fill="none" stroke="url(#orbitGradient)" stroke-width="2" stroke-dasharray="8 6" opacity="0.5" transform="rotate(-14 260 380)"/>

    <!-- Blue Glove (Medical Examination Nitrile) -->
    <g transform="translate(10, 80)">
      <!-- Cuff glow -->
      <ellipse cx="140" cy="500" rx="65" ry="16" fill="#38bdf8" opacity="0.3" filter="url(#blurGlow)"/>
      <!-- Glove Body Silhouette -->
      <path d="M 90,490 C 85,380 75,280 80,240 C 70,200 60,140 70,120 C 78,105 92,110 98,135 C 105,170 108,220 110,230 C 112,180 115,80 128,70 C 138,62 148,72 148,100 C 148,150 146,210 148,225 C 152,175 160,50 174,45 C 185,42 195,54 194,85 C 190,145 186,210 188,225 C 195,185 208,95 220,95 C 230,95 238,110 234,140 C 228,190 220,240 220,270 C 235,275 270,300 275,335 C 280,365 260,390 235,385 C 220,380 205,420 195,490 Z" 
            fill="url(#blueGloveGrad)" filter="url(#dropShadow)"/>
      <!-- Specular Sheen & Muscle Highlights -->
      <path d="M 112,250 Q 148,280 185,250 Q 195,350 160,450" fill="none" stroke="#e0f2fe" stroke-width="4" opacity="0.35" filter="url(#softBlur)"/>
      <!-- Knuckle Creases -->
      <line x1="124" y1="160" x2="136" y2="160" stroke="#bae6fd" stroke-width="2" opacity="0.5"/>
      <line x1="166" y1="140" x2="182" y2="140" stroke="#bae6fd" stroke-width="2" opacity="0.5"/>
      <line x1="208" y1="180" x2="220" y2="180" stroke="#bae6fd" stroke-width="2" opacity="0.5"/>
      <!-- Beaded Cuff -->
      <ellipse cx="142" cy="492" rx="55" ry="10" fill="#bae6fd" opacity="0.8"/>
      <ellipse cx="142" cy="495" rx="52" ry="8" fill="#0284c7"/>
    </g>

    <!-- Black Glove (Surgical High-Tactile Nitrile) -->
    <g transform="translate(260, 130)">
      <!-- Cuff glow -->
      <ellipse cx="150" cy="470" rx="60" ry="15" fill="#475569" opacity="0.2" filter="url(#blurGlow)"/>
      <!-- Glove Body Silhouette -->
      <path d="M 100,460 C 95,360 88,270 92,230 C 82,195 72,135 82,118 C 90,105 102,110 108,132 C 114,165 116,210 118,220 C 120,175 124,80 136,70 C 146,62 155,72 154,98 C 152,145 150,200 152,215 C 156,170 165,55 178,50 C 188,48 197,58 196,88 C 192,140 188,200 190,215 C 196,180 208,98 219,98 C 228,98 235,112 232,138 C 226,185 218,230 218,260 C 232,265 264,288 268,320 C 272,348 254,370 230,366 C 218,362 205,400 196,460 Z" 
            fill="url(#blackGloveGrad)" filter="url(#dropShadow)"/>
      <!-- Matte Specular Sheen -->
      <path d="M 120,240 Q 150,270 182,240 Q 190,340 165,430" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.3" filter="url(#softBlur)"/>
      <!-- Beaded Cuff -->
      <ellipse cx="148" cy="462" rx="50" ry="9" fill="#64748b" opacity="0.8"/>
      <ellipse cx="148" cy="465" rx="47" ry="7" fill="#1e293b"/>
    </g>

    <!-- Orbiting Satellite Products -->
    <!-- 1. AROSAFE Disinfectant Wipe Pack -->
    <g transform="translate(-70, 160)">
      <rect x="0" y="0" width="80" height="110" rx="8" fill="#ffffff" stroke="#38bdf8" stroke-width="2" filter="url(#dropShadow)"/>
      <rect x="10" y="20" width="60" height="25" rx="4" fill="#0284c7"/>
      <text x="14" y="37" fill="#ffffff" font-size="9" font-weight="900" font-family="sans-serif">+ AROSAFE</text>
      <text x="18" y="70" fill="#64748b" font-size="8" font-family="monospace">WET WIPES</text>
      <line x1="12" y1="85" x2="68" y2="85" stroke="#e2e8f0" stroke-width="2"/>
    </g>

    <!-- 2. Surgical Face Mask -->
    <g transform="translate(40, 370)">
      <rect x="0" y="0" width="120" height="70" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" filter="url(#dropShadow)"/>
      <!-- Mask Pleats -->
      <line x1="8" y1="22" x2="112" y2="22" stroke="#93c5fd" stroke-width="2"/>
      <line x1="8" y1="36" x2="112" y2="36" stroke="#93c5fd" stroke-width="2"/>
      <line x1="8" y1="50" x2="112" y2="50" stroke="#93c5fd" stroke-width="2"/>
      <!-- Ear loops -->
      <path d="M 0,15 C -25,25 -25,45 0,55" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M 120,15 C 145,25 145,45 120,55" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    </g>

    <!-- 3. Bouffant Surgical Cap -->
    <g transform="translate(170, 70)">
      <ellipse cx="40" cy="35" rx="40" ry="32" fill="#7dd3fc" opacity="0.9" filter="url(#dropShadow)"/>
      <ellipse cx="40" cy="48" rx="35" ry="10" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 2"/>
    </g>

    <!-- 4. Surgical Tape Spool -->
    <g transform="translate(520, 390)">
      <ellipse cx="40" cy="40" rx="36" ry="36" fill="#f8fafc" stroke="#38bdf8" stroke-width="2" filter="url(#dropShadow)"/>
      <circle cx="40" cy="40" r="14" fill="#040a18" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 40,76 C 70,85 100,82 120,78" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

</svg>